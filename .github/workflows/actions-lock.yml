# Verifies the actions lockfile (.github/workflows/actions.lock) on pull
# requests and on `main`. It is a separate workflow rather than a job in
# checks.yml, so a lock failure is reported on its own.
name: actions-lock

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  lockfile:
    name: lockfile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install gh-actions-lock
        run: gh actions-lock --version >/dev/null 2>&1 || gh extension install github/gh-actions-lock --pin v0.5.1

      - name: Verify the actions lockfile
        run: gh actions-lock --verify
