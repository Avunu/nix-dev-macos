# CI for pull requests and for `main`: evaluates the configuration for both
# architectures and runs the nixfmt hook. Nothing is activated, so a change
# that evaluates but misbehaves on a real Mac is only caught there.
name: checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false

      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false

      # --impure: the configured user comes from the environment.
      - name: nix flake check (eval, pre-commit hooks)
        run: nix flake check --impure -L

      - name: Build system-upgrade
        run: nix build --no-link -L ".#packages.$(nix eval --impure --raw --expr builtins.currentSystem).system-upgrade"
